name: Site snapshot

# Copies public data from divulgeadventures.com (Media Library list, trips, posts, pages)
# into site-data/ so the scheduled Claude runs can read it from GitHub.
# 05:45 and 13:45 Nairobi time, before the blog runs (06:48, 14:48) and the trip run (08:30).
on:
  schedule:
    - cron: "45 2 * * *"
    - cron: "45 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/snapshot_site.py
      - scripts/check_feeds.py
      - .github/workflows/site-snapshot.yml

permissions:
  contents: write

concurrency:
  group: site-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the site
        run: python3 scripts/snapshot_site.py
      - name: Check RSS feeds (Pinterest)
        continue-on-error: true
        run: python3 scripts/check_feeds.py
      - name: Commit changes
        run: |
          git config user.name "divulgeadventures"
          git config user.email "divulgeadventures@gmail.com"
          git add site-data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Site snapshot $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
